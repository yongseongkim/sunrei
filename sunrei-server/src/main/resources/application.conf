ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
}

app {
    name = "Sunrei Server"
    version = "1.0.0"
}

database {
    host = localhost
    port = 5432
    name = sunrei
    user = sunrei
    password = sunrei
    poolSize = 5
    connectionTimeout = 30000
    logging = false
}

logging {
    level = INFO
}

cors {
    allowedHosts = "*"
}

features {
    seedData = false
    apiDocs = false
}

jwt {
    pageToken {
        secret = ${?JWT_PAGE_TOKEN_SECRET}
    }
}

aws {
    region = ap-northeast-2
    accessKeyId = ${?AWS_ACCESS_KEY_ID}
    secretAccessKey = ${?AWS_SECRET_ACCESS_KEY}
    s3 {
        bucket = sunrei-images
        publicUrl = "https://sunrei-images.s3.ap-northeast-2.amazonaws.com"
    }
}