ktor:
  application:
    modules:
      - com.sunrei.ApplicationKt.module
  deployment:
    port: 3030
    host: 0.0.0.0
    watch: [ classes, resources ]

database:
  host: localhost
  port: 5432
  name: sunrei
  user: sunrei
  password: sunrei
  poolSize: 5
  connectionTimeout: 30000
  logging: true

logging:
  level: DEBUG

cors:
  allowedHosts: "*"

features:
  seedData: true
  apiDocs: true

jwt:
  pageToken:
    secret: ${JWT_PAGE_TOKEN_SECRET:-sunrei-dev-page-token-secret-change-in-production}
