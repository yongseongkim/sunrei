include "application.conf"

ktor {
    deployment {
        port = 3030
        port = ${?PORT}
        host = 0.0.0.0
    }
}

database {
    host = ${DATABASE_HOST}
    port = 5432
    port = ${?DATABASE_PORT}
    name = ${DATABASE_NAME}
    user = ${DATABASE_USER}
    password = ${DATABASE_PASSWORD}
    poolSize = 20
    poolSize = ${?DATABASE_POOL_SIZE}
    connectionTimeout = 30000
    connectionTimeout = ${?DATABASE_CONNECTION_TIMEOUT}
    logging = false
}

logging {
    level = WARN
    level = ${?LOG_LEVEL}
}

cors {
    allowedHosts = "sunrei.com,www.sunrei.com"
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}

features {
    seedData = false
    apiDocs = false
}

jwt {
    pageToken {
        secret = ${JWT_PAGE_TOKEN_SECRET}
    }
}

aws {
    region = ap-northeast-2
    region = ${?AWS_REGION}
    accessKeyId = ${AWS_ACCESS_KEY_ID}
    secretAccessKey = ${AWS_SECRET_ACCESS_KEY}
    s3 {
        bucket = sunrei-resources
        bucket = ${?AWS_S3_BUCKET}
        publicUrl = "https://sunrei-resources.s3.ap-northeast-2.amazonaws.com"
        publicUrl = ${?AWS_S3_PUBLIC_URL}
    }
}
