include "application.conf"

ktor {
    deployment {
        port = ${?PORT}
        port = 3030
        host = 0.0.0.0
    }
}

database {
    host = ${DATABASE_HOST}
    port = ${?DATABASE_PORT}
    port = 5432
    name = ${DATABASE_NAME}
    user = ${DATABASE_USER}
    password = ${DATABASE_PASSWORD}
    poolSize = ${?DATABASE_POOL_SIZE}
    poolSize = 20
    connectionTimeout = ${?DATABASE_CONNECTION_TIMEOUT}
    connectionTimeout = 30000
    logging = false
}

logging {
    level = ${?LOG_LEVEL}
    level = WARN
}

cors {
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
    allowedHosts = "sunrei.com,www.sunrei.com"
}

features {
    seedData = false
    apiDocs = false
}

jwt {
    pageToken {
        secret = ${JWT_PAGE_TOKEN_SECRET}
    }
}

aws {
    region = ${?AWS_REGION}
    region = ap-northeast-2
    accessKeyId = ${AWS_ACCESS_KEY_ID}
    secretAccessKey = ${AWS_SECRET_ACCESS_KEY}
    s3 {
        bucket = ${?AWS_S3_BUCKET}
        bucket = sunrei-images
        publicUrl = ${?AWS_S3_PUBLIC_URL}
        publicUrl = "https://sunrei-images.s3.ap-northeast-2.amazonaws.com"
    }
}