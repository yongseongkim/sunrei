[project]
name = "youtube-video-extractor"
version = "0.1.0"
description = "Extract location data from YouTube videos using AI (Claude/Gemini)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api>=1.2.2",
    "yt-dlp>=2024.0.0",
    "google-cloud-speech>=2.0.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.5",
    "google-api-python-client>=2.184.0",
    "googlemaps>=4.10.0",
    "python-dotenv>=1.1.1",
]
