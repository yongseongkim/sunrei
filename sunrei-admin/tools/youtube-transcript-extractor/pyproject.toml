[project]
name = "youtube-transcript-extractor"
version = "0.1.0"
description = "Extract transcripts from YouTube playlists and generate Sunrei location data using AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "boto3>=1.40.45",
    "google-api-python-client>=2.184.0",
    "google-generativeai>=0.8.5",
    "googlemaps>=4.10.0",
    "openai>=2.1.0",
    "python-dotenv>=1.1.1",
    "youtube-transcript-api>=1.2.2",
]
