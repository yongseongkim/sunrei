openapi: 3.0.0
info:
  title: Sunrei Admin API
  version: 2.0.0
  description: Admin API for Sunrei content management (Source -> Sunrei -> SunreiSpot -> Place).

servers:
  - url: http://localhost:3030
    description: Development server

security: [ ]

paths:
  /admin/auth/login:
    post:
      summary: Admin login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  # ===== Sources =====
  /admin/sources:
    get:
      summary: List sources
      operationId: listSources
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated list of sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourcesResult'
        '401': { description: Unauthorized }
    post:
      summary: Create source
      operationId: createSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/sources/{id}:
    get:
      summary: Get source
      operationId: getSource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Source detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      summary: Update source
      operationId: updateSource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      summary: Soft-delete source
      operationId: deleteSource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Source deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }

  # ===== Sunreis =====
  /admin/sunreis:
    get:
      summary: List Sunreis with pagination
      operationId: listSunreis
      security: [{ bearerAuth: [] }]
      parameters:
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: q
          in: query
          schema: { type: string }
        - name: sourceId
          in: query
          schema: { type: string }
        - name: published
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated list of Sunreis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSunreisResult'
        '401': { description: Unauthorized }
    post:
      summary: Create new Sunrei
      operationId: createSunrei
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSunreiRequest'
      responses:
        '201':
          description: Sunrei created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/sunreis/{id}:
    get:
      summary: Get Sunrei details
      operationId: getSunrei
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sunrei details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      summary: Update Sunrei
      operationId: updateSunrei
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSunreiRequest'
      responses:
        '200':
          description: Sunrei updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      summary: Delete Sunrei
      operationId: deleteSunrei
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Sunrei deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }

  # ===== Places =====
  /admin/places:
    get:
      summary: List places (keyed by Google place_id; Area/Sources/Spots columns)
      operationId: listPlaces
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated list of places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlacesResult'
        '401': { description: Unauthorized }

  # ===== Tags =====
  /admin/tags:
    get:
      summary: List tags with pagination
      operationId: listTags
      security: [{ bearerAuth: [] }]
      parameters:
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated list of tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsResult'
        '401': { description: Unauthorized }
    post:
      summary: Create new bilingual tag
      operationId: createTag
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/tags/search:
    get:
      summary: Search tags by label (en or ko)
      operationId: searchTags
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of matching tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagDTO'
        '401': { description: Unauthorized }

  /admin/tags/{id}:
    get:
      summary: Get tag with associated spots
      operationId: getTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tag with spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWithSpots'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      summary: Update tag labels
      operationId: updateTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      summary: Delete tag
      operationId: deleteTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Tag deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }

  /admin/tags/{id}/spots/{spotId}:
    delete:
      summary: Detach a spot from a tag
      operationId: detachSpotFromTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Tag ID
        - name: spotId
          in: path
          required: true
          schema: { type: string }
          description: SunreiSpot ID to detach
      responses:
        '204': { description: Spot detached from tag }
        '401': { description: Unauthorized }
        '404': { description: Tag-spot association not found }

  # ===== Images =====
  /admin/images/upload:
    post:
      summary: Upload image
      operationId: uploadImage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image uploaded (multiple sizes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiSizeImageDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/images/upload-url:
    post:
      summary: Upload image from URL
      operationId: uploadImageFromUrl
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '201':
          description: Image uploaded from URL (multiple sizes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiSizeImageDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for admin authentication

  schemas:
    # ===== Common =====
    PlaceDTO:
      type: object
      required: [id, name, latitude, longitude, isClosed]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number, format: float }
        longitude: { type: number, format: float }
        googleMapsId: { type: string, nullable: true }
        isClosed: { type: boolean }
        closedReason: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }

    ImageDTO:
      type: object
      required: [url]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }

    MultiSizeImageDTO:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageDTO'

    PlaceInput:
      type: object
      required: [name, address, latitude, longitude]
      properties:
        id: { type: string, description: ID for existing place (omit to create new) }
        name: { type: string }
        address: { type: string }
        latitude: { type: number, format: float }
        longitude: { type: number, format: float }
        googleMapsId: { type: string, nullable: true, description: Google Maps Place ID (dedupe key) }

    ImageInput:
      type: object
      required: [url]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }

    SourceType:
      type: string
      enum: [YOUTUBE, TV, ANIME, OTHER]

    # ===== Sources =====
    SourceDTO:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type:
          $ref: '#/components/schemas/SourceType'
        name: { type: string }
        nameEn: { type: string, nullable: true }
        nameKo: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        posterImage:
          allOf:
            - $ref: '#/components/schemas/MultiSizeImageDTO'
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SourceRowDTO:
      description: Source list row with counts (app-behavior text is derived client-side from type).
      allOf:
        - $ref: '#/components/schemas/SourceDTO'
        - type: object
          properties:
            sunreiCount: { type: integer }
            spotCount: { type: integer }

    CreateSourceRequest:
      type: object
      required: [type, name]
      properties:
        type:
          $ref: '#/components/schemas/SourceType'
        name: { type: string }
        nameEn: { type: string, nullable: true }
        nameKo: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        posterImage:
          allOf:
            - $ref: '#/components/schemas/MultiSizeImageDTO'
          nullable: true

    UpdateSourceRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SourceType'
        name: { type: string, nullable: true }
        nameEn: { type: string, nullable: true }
        nameKo: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        posterImage:
          allOf:
            - $ref: '#/components/schemas/MultiSizeImageDTO'
          nullable: true

    ListSourcesResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SourceRowDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }

    # ===== Tags (bilingual) =====
    TagDTO:
      type: object
      required: [id, labelEn, labelKo]
      properties:
        id: { type: string }
        labelEn: { type: string, maxLength: 64 }
        labelKo: { type: string, maxLength: 64 }
        description: { type: string, nullable: true }

    CreateTagRequest:
      type: object
      required: [labelEn, labelKo]
      properties:
        labelEn: { type: string, maxLength: 64 }
        labelKo: { type: string, maxLength: 64 }
        description: { type: string, nullable: true }

    UpdateTagRequest:
      type: object
      properties:
        labelEn: { type: string, maxLength: 64, nullable: true }
        labelKo: { type: string, maxLength: 64, nullable: true }
        description: { type: string, nullable: true }

    SpotSummaryDTO:
      type: object
      required: [id, title, sunreiId, sunreiTitle]
      properties:
        id: { type: string }
        title: { type: string }
        sunreiId: { type: string }
        sunreiTitle: { type: string }

    TagWithSpots:
      allOf:
        - $ref: '#/components/schemas/TagDTO'
        - type: object
          required: [spots]
          properties:
            spots:
              type: array
              items:
                $ref: '#/components/schemas/SpotSummaryDTO'

    ListTagsResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }
        spotCountByTagId:
          type: object
          description: Map of tag ID to number of associated SunreiSpots
          additionalProperties: { type: integer }

    # ===== Places (list rows) =====
    PlaceListItemDTO:
      type: object
      required: [id, name, latitude, longitude, isClosed, sourceCount, spotCount]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number, format: float }
        longitude: { type: number, format: float }
        googleMapsId: { type: string, nullable: true }
        isClosed: { type: boolean }
        area:
          type: string
          nullable: true
          description: Area label (KO), derived from address.
        sourceCount: { type: integer }
        spotCount: { type: integer }

    ListPlacesResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlaceListItemDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }

    # ===== Sunrei + spots =====
    SunreiSpotDTO:
      type: object
      required: [id, sunreiId, title, images, place, tags]
      properties:
        id: { type: string }
        sunreiId: { type: string }
        title: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
        context: { type: string, nullable: true, description: What this source says here. }
        youtubeLink: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        place:
          $ref: '#/components/schemas/PlaceDTO'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'

    SunreiDTO:
      type: object
      required: [id, sourceId, source, title, images, spots]
      properties:
        id: { type: string }
        sourceId: { type: string }
        source:
          $ref: '#/components/schemas/SourceDTO'
        publishedAt: { type: string, format: date-time, nullable: true, description: NULL = draft; set = published }
        title: { type: string }
        description: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        link: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spots:
          type: array
          items:
            $ref: '#/components/schemas/SunreiSpotDTO'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateSunreiRequest:
      type: object
      required: [sourceId, published, title]
      properties:
        sourceId: { type: string }
        published:
          type: boolean
          description: true -> published_at = now() (preserved on re-save); false -> NULL (draft).
        title: { type: string }
        summary: { type: string, nullable: true }
        description: { type: string, nullable: true }
        link: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spots:
          type: array
          items:
            $ref: '#/components/schemas/CreateSunreiSpotInline'

    UpdateSunreiRequest:
      type: object
      properties:
        sourceId: { type: string, nullable: true }
        published:
          type: boolean
          nullable: true
        title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        description: { type: string, nullable: true }
        link: { type: string, nullable: true }
        images:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spots:
          type: array
          items:
            $ref: '#/components/schemas/UpdateSunreiSpotInline'

    CreateSunreiSpotInline:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
        context: { type: string, nullable: true }
        youtubeLink: { type: string, nullable: true }
        place:
          allOf:
            - $ref: '#/components/schemas/PlaceInput'
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        tagIds:
          type: array
          description: Existing tag IDs to attach to this spot.
          items: { type: string }
        tagLabels:
          type: array
          description: KO labels to find-or-create and attach (ko=typed, en=typed until translated).
          items: { type: string }

    UpdateSunreiSpotInline:
      type: object
      required: [title]
      properties:
        id: { type: string, description: ID for existing spot (omit for new spots) }
        title: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
        context: { type: string, nullable: true }
        youtubeLink: { type: string, nullable: true }
        place:
          allOf:
            - $ref: '#/components/schemas/PlaceInput'
          nullable: true
        images:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        tagIds:
          type: array
          nullable: true
          description: Replaces this spot's tags when present.
          items: { type: string }
        tagLabels:
          type: array
          nullable: true
          description: KO labels to find-or-create and attach.
          items: { type: string }
        _delete: { type: boolean, description: Mark this spot for deletion }

    # ===== Sunrei list result =====
    ListSunreisResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SunreiDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }

    # ===== Auth (unchanged) =====
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresIn, user]
      properties:
        token: { type: string }
        expiresIn: { type: integer }
        user:
          $ref: '#/components/schemas/LoginResponseUser'

    LoginResponseUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string }
