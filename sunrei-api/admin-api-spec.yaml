openapi: 3.0.0
info:
  title: Sunrei Admin API
  version: 2.0.0
  description: Admin API for Sunrei content management (Source -> Sunrei -> SunreiSpot -> Place).

servers:
  - url: http://localhost:3030
    description: Development server

security: [ ]

paths:
  /admin/auth/login:
    post:
      summary: Admin login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  # ===== Sources =====
  /admin/sources:
    get:
      summary: List sources
      operationId: listSources
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated list of sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourcesResult'
        '401': { description: Unauthorized }
    post:
      summary: Create source
      operationId: createSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/sources/{id}:
    get:
      summary: Get source
      operationId: getSource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Source detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      summary: Update source
      operationId: updateSource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: Source updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      summary: Soft-delete source
      operationId: deleteSource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Source deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }

  # ===== Sunreis =====
  /admin/sunreis:
    get:
      summary: List Sunreis with pagination
      operationId: listSunreis
      security: [{ bearerAuth: [] }]
      parameters:
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: q
          in: query
          schema: { type: string }
        - name: sourceId
          in: query
          schema: { type: string }
        - name: published
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated list of Sunreis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSunreisResult'
        '401': { description: Unauthorized }
    post:
      summary: Create new Sunrei
      operationId: createSunrei
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSunreiRequest'
      responses:
        '201':
          description: Sunrei created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/sunreis/{id}:
    get:
      summary: Get Sunrei details
      operationId: getSunrei
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sunrei details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      summary: Update Sunrei
      operationId: updateSunrei
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSunreiRequest'
      responses:
        '200':
          description: Sunrei updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      summary: Delete Sunrei
      operationId: deleteSunrei
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Sunrei deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }

  # ===== Places =====
  /admin/places:
    get:
      summary: List places (keyed by Google place_id; Area/Sources/Spots columns)
      operationId: listPlaces
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated list of places
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlacesResult'
        '401': { description: Unauthorized }

  /admin/places/{id}:
    patch:
      summary: Update a place
      description: >
        Only the fields in the request change; an omitted or null field keeps its value, and an empty
        notes or closedReason clears it.
        The change applies to every spot that points to the place, including whether it is closed.
        latitude and longitude change together. closedAt is set when the place becomes closed and
        cleared with closedReason when it reopens. A googleMapsId that another place already has is
        a conflict, because one Google place is one Sunrei place.
      operationId: updatePlace
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaceRequest'
      responses:
        '200':
          description: Place updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: Another place has the googleMapsId }

  # ===== Tags =====
  /admin/tags:
    get:
      summary: List tags with pagination
      operationId: listTags
      security: [{ bearerAuth: [] }]
      parameters:
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated list of tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsResult'
        '401': { description: Unauthorized }
    post:
      summary: Create new bilingual tag
      operationId: createTag
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/tags/search:
    get:
      summary: Search tags by label (en or ko)
      operationId: searchTags
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of matching tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagDTO'
        '401': { description: Unauthorized }

  /admin/tags/{id}:
    get:
      summary: Get tag with associated spots
      operationId: getTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tag with spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagWithSpots'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      summary: Update tag labels
      operationId: updateTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      summary: Delete tag
      operationId: deleteTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Tag deleted }
        '401': { description: Unauthorized }
        '404': { description: Not found }

  /admin/tags/{id}/spots/{spotId}:
    delete:
      summary: Detach a spot from a tag
      operationId: detachSpotFromTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Tag ID
        - name: spotId
          in: path
          required: true
          schema: { type: string }
          description: SunreiSpot ID to detach
      responses:
        '204': { description: Spot detached from tag }
        '401': { description: Unauthorized }
        '404': { description: Tag-spot association not found }

  # ===== Images =====
  /admin/images/upload:
    post:
      summary: Upload image
      operationId: uploadImage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image uploaded (multiple sizes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiSizeImageDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/images/upload-url:
    post:
      summary: Upload image from URL
      operationId: uploadImageFromUrl
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        '201':
          description: Image uploaded from URL (multiple sizes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiSizeImageDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  # ===== Resources (YouTube channel registries) =====
  /admin/resources/youtube/{channelId}:
    get:
      summary: Get YouTube channel registry (raw JSON from S3)
      operationId: getYoutubeResource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Channel registry JSON (free-form)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { description: channelId is required }
        '401': { description: Unauthorized }
        '404': { description: Channel registry not found }
    put:
      summary: Store YouTube channel registry (raw JSON to S3)
      operationId: putYoutubeResource
      security: [{ bearerAuth: [] }]
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Channel registry saved }
        '400': { description: Invalid JSON body or channelId is required }
        '401': { description: Unauthorized }

  # ===== YouTube collection =====
  /admin/youtube/playlists:
    get:
      summary: List registered YouTube playlists
      operationId: listYoutubePlaylists
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Registered playlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListYoutubePlaylistsResult'
        '401': { description: Unauthorized }

  /admin/youtube/playlists/{id}:
    get:
      summary: Get a registered YouTube playlist
      operationId: getYoutubePlaylist
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubePlaylistDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      summary: Register or update a YouTube playlist
      operationId: upsertYoutubePlaylist
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertYoutubePlaylistRequest'
      responses:
        '200':
          description: Playlist saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubePlaylistDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }

  /admin/youtube/playlists/{id}/videos:
    put:
      summary: Sync the playlist's current videos and return videos waiting for processing
      description: >
        Upserts every listed video, marks videos missing from the list as removed,
        and records the sync time. Removed videos keep their data and spots.
      operationId: syncYoutubePlaylistVideos
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncYoutubePlaylistVideosRequest'
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncYoutubePlaylistVideosResult'
        '401': { description: Unauthorized }
        '404': { description: Playlist not found }

  /admin/youtube/videos:
    get:
      summary: List YouTube videos
      operationId: listYoutubeVideos
      security: [{ bearerAuth: [] }]
      parameters:
        - name: playlistId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/YoutubeVideoStatus'
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated videos, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListYoutubeVideosResult'
        '401': { description: Unauthorized }

  /admin/youtube/videos/{id}:
    get:
      summary: Get a video with its texts, extraction runs, and attempts
      operationId: getYoutubeVideo
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Video detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeVideoDetailDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    patch:
      summary: Update a video's processing status
      description: A non-null error is also recorded as an attempt for that stage.
      operationId: updateYoutubeVideo
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateYoutubeVideoRequest'
      responses:
        '200':
          description: Video updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeVideoDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }

  /admin/youtube/videos/{id}/texts:
    post:
      summary: Store a collected or derived text for a video
      operationId: createYoutubeVideoText
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateYoutubeVideoTextRequest'
      responses:
        '201':
          description: Text stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeVideoTextDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Video not found }

  /admin/youtube/texts/{id}:
    get:
      summary: Get a stored text with its segments
      operationId: getYoutubeVideoText
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Text with segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeVideoTextDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }

  /admin/youtube/videos/{id}/extraction-runs:
    post:
      summary: Record an extraction run and its place candidates
      operationId: createYoutubeExtractionRun
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateYoutubeExtractionRunRequest'
      responses:
        '201':
          description: Run recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeExtractionRunDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Video not found }

  /admin/youtube/extracted-places:
    get:
      summary: List extracted place candidates
      operationId: listYoutubeExtractedPlaces
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewStatus
          in: query
          schema:
            $ref: '#/components/schemas/YoutubeReviewStatus'
        - name: playlistId
          in: query
          schema: { type: string }
        - name: videoId
          in: query
          schema: { type: string }
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated candidates, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListYoutubeExtractedPlacesResult'
        '401': { description: Unauthorized }

  /admin/youtube/extracted-places/{id}:
    patch:
      summary: Review an extracted place
      description: >
        APPROVED creates a SunreiSpot in the playlist's Sunrei from the reviewed place.
        REJECTED and PENDING only change the review status. When no candidate of the
        video remains pending, a REVIEW_PENDING video becomes COMPLETED.
      operationId: reviewYoutubeExtractedPlace
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewYoutubeExtractedPlaceRequest'
      responses:
        '200':
          description: Candidate reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YoutubeExtractedPlaceDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: "Already approved, or no target Sunrei" }

  # ===== Instagram collection =====
  /admin/instagram/accounts:
    get:
      summary: List registered Instagram accounts
      operationId: listInstagramAccounts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Registered accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstagramAccountsResult'
        '401': { description: Unauthorized }

  /admin/instagram/accounts/{id}:
    get:
      summary: Get a registered Instagram account
      operationId: getInstagramAccount
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramAccountDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    put:
      summary: Register or update an Instagram account
      description: The path id is the Instagram user ID from Business Discovery.
      operationId: upsertInstagramAccount
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertInstagramAccountRequest'
      responses:
        '200':
          description: Account saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramAccountDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '409': { description: Username already used by another account }

  /admin/instagram/accounts/{id}/posts:
    put:
      summary: Store a page of the account's posts with their captions
      description: >
        Inserts new posts with initialStatus and updates the caption, title, and counts of
        existing posts without changing their status. Posts missing from the request are left alone.
      operationId: upsertInstagramPosts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertInstagramPostsRequest'
      responses:
        '200':
          description: Upsert result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertInstagramPostsResult'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Account not found }

  /admin/instagram/posts:
    get:
      summary: List Instagram posts
      operationId: listInstagramPosts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: accountId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InstagramPostStatus'
        - name: mediaType
          in: query
          schema:
            $ref: '#/components/schemas/InstagramMediaType'
        - name: locationTagRead
          in: query
          schema: { type: boolean }
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated posts, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstagramPostsResult'
        '401': { description: Unauthorized }

  /admin/instagram/posts/{id}:
    get:
      summary: Get a post with its texts, extraction runs, and attempts
      operationId: getInstagramPost
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Post detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramPostDetailDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }
    patch:
      summary: Update a post's processing status
      description: A non-empty error is also recorded as an attempt for that stage.
      operationId: updateInstagramPost
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstagramPostRequest'
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramPostDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }

  /admin/instagram/posts/{id}/location-tag:
    put:
      summary: Record the location tag read from the post page
      description: A null locationTag records that the page was read and has no tag.
      operationId: setInstagramPostLocationTag
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInstagramLocationTagRequest'
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramPostDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }

  /admin/instagram/posts/{id}/images:
    put:
      summary: Replace the copies of a post's images
      description: >
        The images must already be in Sunrei's image storage (for example through
        /admin/images/upload-url), because Instagram's image URLs expire. Spots already
        approved from the post that have no images get these images.
      operationId: setInstagramPostImages
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInstagramPostImagesRequest'
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramPostDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Not found }

  /admin/instagram/posts/{id}/texts:
    post:
      summary: Store a Whisper transcript or OCR text for a reel
      operationId: createInstagramPostText
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstagramPostTextRequest'
      responses:
        '201':
          description: Text stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramPostTextDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Post not found }

  /admin/instagram/texts/{id}:
    get:
      summary: Get a stored text with its segments
      operationId: getInstagramPostText
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Text with segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramPostTextDTO'
        '401': { description: Unauthorized }
        '404': { description: Not found }

  /admin/instagram/posts/{id}/extraction-runs:
    post:
      summary: Record an extraction run and its place candidates
      description: >
        A succeeded run copies its promotion to the post and supersedes the post's pending
        candidates from earlier runs. Places of a DISCLOSED_AD or SELF_PROMOTION run are not
        stored as candidates; they stay in rawOutput.
      operationId: createInstagramExtractionRun
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstagramExtractionRunRequest'
      responses:
        '201':
          description: Run recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramExtractionRunDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Post not found }

  /admin/instagram/extracted-places:
    get:
      summary: List extracted place candidates
      operationId: listInstagramExtractedPlaces
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewStatus
          in: query
          schema:
            $ref: '#/components/schemas/InstagramReviewStatus'
        - name: geocodeStatus
          in: query
          schema:
            $ref: '#/components/schemas/InstagramGeocodeStatus'
        - name: accountId
          in: query
          schema: { type: string }
        - name: postId
          in: query
          schema: { type: string }
        - name: nextToken
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated candidates, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstagramExtractedPlacesResult'
        '401': { description: Unauthorized }

  /admin/instagram/extracted-places/{id}:
    patch:
      summary: Review an extracted place
      description: >
        APPROVED creates a SunreiSpot in the account's Sunrei that links to the post. REJECTED and
        PENDING only change the review status; SUPERSEDED is set only by the server. When no
        candidate of the post remains pending, a REVIEW_PENDING post becomes COMPLETED.
      operationId: reviewInstagramExtractedPlace
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInstagramExtractedPlaceRequest'
      responses:
        '200':
          description: Candidate reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramExtractedPlaceDTO'
        '400': { description: Bad request }
        '401': { description: Unauthorized }
        '404': { description: Not found }
        '409': { description: "Already approved, or no target Sunrei" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for admin authentication

  schemas:
    # ===== Common =====
    PlaceDTO:
      type: object
      required: [id, name, latitude, longitude, isClosed]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number, format: float }
        longitude: { type: number, format: float }
        googleMapsId: { type: string, nullable: true }
        isClosed: { type: boolean }
        closedReason: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }

    ImageDTO:
      type: object
      required: [url]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }

    MultiSizeImageDTO:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageDTO'

    PlaceInput:
      type: object
      required: [name, address, latitude, longitude]
      properties:
        id: { type: string, description: ID for existing place (omit to create new) }
        name: { type: string }
        address: { type: string }
        latitude: { type: number, format: float }
        longitude: { type: number, format: float }
        googleMapsId: { type: string, nullable: true, description: Google Maps Place ID (dedupe key) }

    ImageInput:
      type: object
      required: [url]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }

    SourceType:
      type: string
      enum: [YOUTUBE, INSTAGRAM, TV, ANIME, OTHER]

    # ===== Sources =====
    SourceDTO:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type:
          $ref: '#/components/schemas/SourceType'
        name: { type: string }
        nameEn: { type: string, nullable: true }
        nameKo: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        posterImage:
          allOf:
            - $ref: '#/components/schemas/MultiSizeImageDTO'
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SourceRowDTO:
      description: Source list row with counts (app-behavior text is derived client-side from type).
      allOf:
        - $ref: '#/components/schemas/SourceDTO'
        - type: object
          properties:
            sunreiCount: { type: integer }
            spotCount: { type: integer }

    CreateSourceRequest:
      type: object
      required: [type, name]
      properties:
        type:
          $ref: '#/components/schemas/SourceType'
        name: { type: string }
        nameEn: { type: string, nullable: true }
        nameKo: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        posterImage:
          allOf:
            - $ref: '#/components/schemas/MultiSizeImageDTO'
          nullable: true

    UpdateSourceRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SourceType'
        name: { type: string, nullable: true }
        nameEn: { type: string, nullable: true }
        nameKo: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        posterImage:
          allOf:
            - $ref: '#/components/schemas/MultiSizeImageDTO'
          nullable: true

    ListSourcesResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SourceRowDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }

    # ===== Tags =====
    TagDTO:
      type: object
      required: [id, labelEn, labelKo]
      properties:
        id: { type: string }
        labelEn: { type: string, maxLength: 64 }
        labelKo: { type: string, maxLength: 64 }
        description: { type: string, nullable: true }

    CreateTagRequest:
      type: object
      required: [labelEn, labelKo]
      properties:
        labelEn: { type: string, maxLength: 64 }
        labelKo: { type: string, maxLength: 64 }
        description: { type: string, nullable: true }

    UpdateTagRequest:
      type: object
      properties:
        labelEn: { type: string, maxLength: 64, nullable: true }
        labelKo: { type: string, maxLength: 64, nullable: true }
        description: { type: string, nullable: true }

    SpotSummaryDTO:
      type: object
      required: [id, title, sunreiId, sunreiTitle]
      properties:
        id: { type: string }
        title: { type: string }
        sunreiId: { type: string }
        sunreiTitle: { type: string }

    TagWithSpots:
      allOf:
        - $ref: '#/components/schemas/TagDTO'
        - type: object
          required: [spots]
          properties:
            spots:
              type: array
              items:
                $ref: '#/components/schemas/SpotSummaryDTO'

    ListTagsResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }
        spotCountByTagId:
          type: object
          description: Map of tag ID to number of associated SunreiSpots
          additionalProperties: { type: integer }

    # ===== Places (list rows) =====
    UpdatePlaceRequest:
      type: object
      properties:
        name: { type: string, maxLength: 128, nullable: true }
        address: { type: string, maxLength: 255, nullable: true }
        latitude: { type: number, format: float, nullable: true }
        longitude: { type: number, format: float, nullable: true }
        googleMapsId: { type: string, maxLength: 255, nullable: true }
        isClosed: { type: boolean, nullable: true }
        closedReason: { type: string, maxLength: 255, nullable: true, description: "Why it closed, such as permanently closed on Google Maps" }
        notes: { type: string, nullable: true }

    PlaceListItemDTO:
      type: object
      required: [id, name, latitude, longitude, isClosed, sourceCount, spotCount]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number, format: float }
        longitude: { type: number, format: float }
        googleMapsId: { type: string, nullable: true }
        isClosed: { type: boolean }
        closedReason: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        area:
          type: string
          nullable: true
          description: Area label (KO), derived from address.
        sourceCount: { type: integer }
        spotCount: { type: integer }

    ListPlacesResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlaceListItemDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }

    # ===== Sunrei + spots =====
    SunreiSpotDTO:
      type: object
      required: [id, sunreiId, title, images, place, tags]
      properties:
        id: { type: string }
        sunreiId: { type: string }
        title: { type: string, maxLength: 128 }
        context: { type: string, nullable: true, description: What this source says here. }
        sourceLink: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        place:
          $ref: '#/components/schemas/PlaceDTO'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'

    SunreiDTO:
      type: object
      required: [id, sourceId, source, title, images, spots]
      properties:
        id: { type: string }
        sourceId: { type: string }
        source:
          $ref: '#/components/schemas/SourceDTO'
        publishedAt: { type: string, format: date-time, nullable: true, description: NULL = draft; set = published }
        title: { type: string }
        description: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        link: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spots:
          type: array
          description: Spots in their saved display order.
          items:
            $ref: '#/components/schemas/SunreiSpotDTO'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateSunreiRequest:
      type: object
      required: [sourceId, published, title]
      properties:
        sourceId: { type: string }
        published:
          type: boolean
          description: true -> published_at = now() (preserved on re-save); false -> NULL (draft).
        title: { type: string }
        summary: { type: string, nullable: true }
        description: { type: string, nullable: true }
        link: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spots:
          type: array
          description: The array order becomes the saved spot display order.
          items:
            $ref: '#/components/schemas/CreateSunreiSpotInline'

    UpdateSunreiRequest:
      type: object
      properties:
        sourceId: { type: string, nullable: true }
        published:
          type: boolean
          nullable: true
        title: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        description: { type: string, nullable: true }
        link: { type: string, nullable: true }
        images:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spots:
          type: array
          description: Replaces spot membership and saves this array order. Omitted live spots are soft-deleted; omitting this field preserves membership and order.
          items:
            $ref: '#/components/schemas/UpdateSunreiSpotInline'

    CreateSunreiSpotInline:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 128 }
        context: { type: string, nullable: true }
        sourceLink: { type: string, nullable: true }
        place:
          allOf:
            - $ref: '#/components/schemas/PlaceInput'
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        tagIds:
          type: array
          description: Existing tag IDs to attach to this spot.
          items: { type: string }
        tagLabels:
          type: array
          description: KO labels to find-or-create and attach (ko=typed, en=typed until translated).
          items: { type: string }

    UpdateSunreiSpotInline:
      type: object
      required: [title]
      properties:
        id: { type: string, description: ID for existing spot (omit for new spots) }
        title: { type: string, maxLength: 128 }
        context: { type: string, nullable: true }
        sourceLink: { type: string, nullable: true }
        place:
          allOf:
            - $ref: '#/components/schemas/PlaceInput'
          nullable: true
        images:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        tagIds:
          type: array
          nullable: true
          description: Replaces this spot's tags when present.
          items: { type: string }
        tagLabels:
          type: array
          nullable: true
          description: KO labels to find-or-create and attach.
          items: { type: string }
        _delete: { type: boolean, description: Mark this spot for deletion }

    # ===== Sunrei list result =====
    ListSunreisResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SunreiDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }

    # ===== YouTube collection =====
    YoutubeVideoStatus:
      type: string
      enum: [PENDING, PROCESSING, REVIEW_PENDING, COMPLETED, FAILED, SKIPPED]

    YoutubeReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    YoutubeTextKind:
      type: string
      enum: [CAPTIONS, WHISPER, OCR, TRANSCRIPT_REVIEWED, TRANSCRIPT_REVIEW, TIMELINE]

    YoutubeExtractionRunStatus:
      type: string
      enum: [SUCCEEDED, FAILED]

    YoutubeConfidence:
      type: string
      enum: [HIGH, MEDIUM, LOW]

    YoutubePlaylistDTO:
      type: object
      required: [id, title, syncEnabled, videoCount, pendingVideoCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        channelId: { type: string, nullable: true }
        channelTitle: { type: string, nullable: true }
        sunreiId: { type: string, nullable: true, description: Approved places are added to this Sunrei }
        syncEnabled: { type: boolean }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        videoCount: { type: integer, description: Videos currently in the playlist }
        pendingVideoCount: { type: integer, description: Videos in the playlist waiting for processing }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ListYoutubePlaylistsResult:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/YoutubePlaylistDTO'

    UpsertYoutubePlaylistRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        channelId: { type: string, nullable: true }
        channelTitle: { type: string, nullable: true }
        sunreiId: { type: string, nullable: true }
        syncEnabled: { type: boolean, nullable: true, description: Defaults to true for a new playlist }

    YoutubeVideoInput:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        channelId: { type: string, nullable: true }
        channelTitle: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        position: { type: integer, nullable: true }

    SyncYoutubePlaylistVideosRequest:
      type: object
      required: [videos]
      properties:
        videos:
          type: array
          items:
            $ref: '#/components/schemas/YoutubeVideoInput'
        # 새로 추가된 영상의 상태이며, 비우면 PENDING이다.
        # SKIPPED로 보내면 처리하지 않고 기준선으로만 등록한다.
        initialStatus:
          allOf:
            - $ref: '#/components/schemas/YoutubeVideoStatus'
          nullable: true

    SyncYoutubePlaylistVideosResult:
      type: object
      required: [addedVideoIds, removedVideoIds, pendingVideos]
      properties:
        addedVideoIds:
          type: array
          items: { type: string }
        removedVideoIds:
          type: array
          items: { type: string }
        pendingVideos:
          type: array
          description: Videos in the playlist with status PENDING or FAILED, oldest position first
          items:
            $ref: '#/components/schemas/YoutubeVideoDTO'

    YoutubeVideoDTO:
      type: object
      required: [id, title, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        channelId: { type: string, nullable: true }
        channelTitle: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/YoutubeVideoStatus'
        stage: { type: string, nullable: true }
        error: { type: string, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ListYoutubeVideosResult:
      type: object
      required: [data, totalSize, totalElements]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/YoutubeVideoDTO'
        totalSize: { type: integer }
        totalElements: { type: integer }
        nextToken: { type: string, nullable: true }

    UpdateYoutubeVideoRequest:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/YoutubeVideoStatus'
          nullable: true
        stage: { type: string, nullable: true }
        error: { type: string, nullable: true, description: Also recorded as an attempt; an empty string clears the error }

    YoutubeVideoAttemptDTO:
      type: object
      required: [id, stage, error, createdAt]
      properties:
        id: { type: string }
        stage: { type: string }
        error: { type: string }
        createdAt: { type: string, format: date-time }

    YoutubeSegmentDTO:
      type: object
      required: [start, text]
      properties:
        start: { type: number, format: double }
        end: { type: number, format: double, nullable: true }
        text: { type: string }
        source: { type: string, nullable: true, description: "Timeline source such as transcript, whisper, or ocr" }

    CreateYoutubeVideoTextRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/YoutubeTextKind'
        language: { type: string, nullable: true }
