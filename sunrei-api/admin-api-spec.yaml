openapi: 3.0.0
info:
  title: Sunrei Admin API
  version: 1.0.0
  description: Admin API for Sunrei management

servers:
  - url: http://localhost:3030
    description: Development server

security: [ ]

paths:
  /admin/auth/login:
    post:
      summary: Admin login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /admin/sunreis:
    get:
      summary: List Sunreis with pagination
      operationId: listSunreis
      security:
        - bearerAuth: [ ]
      parameters:
        - name: nextToken
          in: query
          schema:
            type: string
          description: Token for next page (from previous response)
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of Sunreis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSunreisResult'
        '401':
          description: Unauthorized

    post:
      summary: Create new Sunrei
      operationId: createSunrei
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSunreiRequest'
      responses:
        '201':
          description: Sunrei created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '401':
          description: Unauthorized
        '400':
          description: Bad request

  /admin/sunreis/{id}:
    get:
      summary: Get Sunrei details
      operationId: getSunrei
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sunrei details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '401':
          description: Unauthorized
        '404':
          description: Not found

    put:
      summary: Update Sunrei
      operationId: updateSunrei
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSunreiRequest'
      responses:
        '200':
          description: Sunrei updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunreiDTO'
        '401':
          description: Unauthorized
        '404':
          description: Not found

    delete:
      summary: Delete Sunrei
      operationId: deleteSunrei
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Sunrei deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /admin/places/search:
    get:
      summary: Search places for autocomplete
      operationId: searchPlaces
      security:
        - bearerAuth: [ ]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: List of matching places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceDTO'
        '401':
          description: Unauthorized

  /admin/tags:
    get:
      summary: List tags
      operationId: listTags
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagDTO'
        '401':
          description: Unauthorized

    post:
      summary: Create new tag
      operationId: createTag
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'
        '401':
          description: Unauthorized

  /admin/tags/{id}:
    put:
      summary: Update tag
      operationId: updateTag
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDTO'
        '401':
          description: Unauthorized
        '404':
          description: Not found

    delete:
      summary: Delete tag
      operationId: deleteTag
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tag deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /admin/images/upload:
    post:
      summary: Upload image
      operationId: uploadImage
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image uploaded (multiple sizes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiSizeImageDTO'
        '401':
          description: Unauthorized
        '400':
          description: Bad request

  /admin/images/upload-url:
    post:
      summary: Upload image from URL
      operationId: uploadImageFromUrl
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: URL of the image to download and upload
      responses:
        '201':
          description: Image uploaded from URL (multiple sizes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiSizeImageDTO'
        '401':
          description: Unauthorized
        '400':
          description: Bad request

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for admin authentication

  schemas:
    # ===== Common DTOs =====
    PlaceDTO:
      type: object
      required:
        - id
        - name
        - latitude
        - longitude
        - isClosed
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the place
        address:
          type: string
          description: Address of the place
        latitude:
          type: number
          format: float
          description: Latitude of the place
        longitude:
          type: number
          format: float
          description: Longitude of the place
        isClosed:
          type: boolean
          description: Whether the place is permanently closed or no longer exists
        closedReason:
          type: string
          description: Reason for closure (e.g., "Permanently closed", "Demolished", "Relocated")
        closedAt:
          type: string
          format: date-time
          description: Date when the place was closed or ceased to exist
        notes:
          type: string
          description: Additional notes about the place status or history

    ImageDTO:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: URL of the image
        width:
          type: integer
          description: Width of the image in pixels
        height:
          type: integer
          description: Height of the image in pixels
    
    MultiSizeImageDTO:
      type: object
      required:
        - images
      properties:
        images:
          type: array
          description: Array of different image sizes (original, large, medium, small)
          items:
            $ref: '#/components/schemas/ImageDTO'

    SunreiSpotDTO:
      type: object
      required:
        - id
        - sunreiId
        - title
        - place
        - images
      properties:
        id:
          type: string
        sunreiId:
          type: string
          description: ID of the parent Sunrei
        title:
          type: string
          description: Title of the Sunrei Spot
        description:
          type: string
          description: Detailed description of the Sunrei Spot
        youtubeLink:
          type: string
          description: YouTube video link for this spot
          nullable: true
        images:
          type: array
          description: Array of multi-size images for this spot
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        place:
          description: Associated place
          $ref: '#/components/schemas/PlaceDTO'

    TagDTO:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the tag
        description:
          type: string
          description: Description of the tag
          nullable: true

    SunreiDTO:
      type: object
      required:
        - id
        - title
        - images
        - spots
        - tags
      properties:
        id:
          type: string
        title:
          type: string
          description: Title of the Sunrei
        description:
          type: string
          description: Detailed description of the Sunrei
        link:
          type: string
          description: External link for this Sunrei (program URL or YouTube channel)
          nullable: true
        images:
          type: array
          description: Array of multi-size images for this Sunrei
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spots:
          type: array
          description: Array of Sunrei spots associated with this Sunrei
          items:
            $ref: '#/components/schemas/SunreiSpotDTO'
        tags:
          type: array
          description: Array of tags associated with this Sunrei
          items:
            $ref: '#/components/schemas/TagDTO'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ===== Admin API Request/Response Models =====
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required:
        - token
        - expiresIn
        - user
      properties:
        token:
          type: string
          description: JWT token
        expiresIn:
          type: integer
          description: Token expiration time in seconds
        user:
          type: object
          required:
            - id
            - username
            - role
          properties:
            id:
              type: string
            username:
              type: string
            role:
              type: string

    ListSunreisResult:
      type: object
      required:
        - data
        - totalSize
        - totalElements
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SunreiDTO'
        totalSize:
          type: integer
          description: Number of items in this page
        totalElements:
          type: integer
          description: Total number of items across all pages
        nextToken:
          type: string
          description: Token to retrieve next page (null if no more pages)
          nullable: true

    CreateSunreiRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
        link:
          type: string
          nullable: true
        tagIds:
          type: array
          items:
            type: string
        spots:
          type: array
          items:
            $ref: '#/components/schemas/CreateSunreiSpotInline'
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'

    UpdateSunreiRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        link:
          type: string
          nullable: true
        tagIds:
          type: array
          items:
            type: string
        spots:
          type: array
          items:
            $ref: '#/components/schemas/UpdateSunreiSpotInline'
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'

    CreateSunreiSpotInline:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        description:
          type: string
        youtubeLink:
          type: string
          nullable: true
        place:
          $ref: '#/components/schemas/PlaceInput'
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'

    UpdateSunreiSpotInline:
      type: object
      required:
        - title
      properties:
        id:
          type: string
          description: ID for existing spot (omit for new spots)
        title:
          type: string
        description:
          type: string
        youtubeLink:
          type: string
          nullable: true
        place:
          $ref: '#/components/schemas/PlaceInput'
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        _delete:
          type: boolean
          description: Mark this spot for deletion

    PlaceInput:
      type: object
      required:
        - name
        - address
        - latitude
        - longitude
      properties:
        id:
          type: string
          description: ID for existing place (omit to create new)
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float

    ImageInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
        width:
          type: integer
        height:
          type: integer

    CreateTagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    UpdateTagRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true