openapi: 3.0.0
info:
  title: Sunrei App API
  version: 2.0.0
  description: Public map-first API for Sunrei client applications. Distance is always anchored to the map center, never GPS.

servers:
  - url: http://localhost:3030
    description: Development server

paths:
  /api/map:
    get:
      summary: List places for the map (nearby or source mode)
      description: >
        Nearby mode requires viewport bounds (swLat,swLng,neLat,neLng); centerLat/centerLng is the
        map-view center used as the distance/sort anchor (computed from bounds center if absent).
        Source mode is selected by passing sourceIds (comma-separated); it is global (no viewport
        bound), returns every place featured by the selected source(s), nearest-to-center.
        If sourceIds is present, source mode wins; otherwise bounds select nearby mode.
        No tag filtering here — tags are filtered client-side.
      operationId: getMapData
      parameters:
        - name: swLat
          in: query
          schema: { type: number, format: float }
        - name: swLng
          in: query
          schema: { type: number, format: float }
        - name: neLat
          in: query
          schema: { type: number, format: float }
        - name: neLng
          in: query
          schema: { type: number, format: float }
        - name: centerLat
          in: query
          schema: { type: number, format: float }
        - name: centerLng
          in: query
          schema: { type: number, format: float }
        - name: sourceIds
          in: query
          description: Comma-separated source IDs for source mode.
          schema: { type: string }
      responses:
        '200':
          description: Places (one card per place) for the active mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlacesResult'
        '400':
          description: Missing bounds when sourceIds is absent

  /api/sources:
    get:
      summary: List sources (source rail / add-source picker)
      operationId: listSources
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: swLat
          in: query
          schema: { type: number, format: float }
        - name: swLng
          in: query
          schema: { type: number, format: float }
        - name: neLat
          in: query
          schema: { type: number, format: float }
        - name: neLng
          in: query
          schema: { type: number, format: float }
        - name: centerLat
          in: query
          schema: { type: number, format: float }
        - name: centerLng
          in: query
          schema: { type: number, format: float }
      responses:
        '200':
          description: Sources with counts and nearest distance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourcesResult'

  /api/sources/{id}:
    get:
      summary: Get a source (source intro / managed work page)
      description: >
        YouTube sources return enough data to link out; Anime, TV, and Other return managed-work
        page data. Videos are sorted by nearest spot to the optional center.
      operationId: getSource
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: centerLat
          in: query
          schema: { type: number, format: float }
        - name: centerLng
          in: query
          schema: { type: number, format: float }
      responses:
        '200':
          description: Source detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSourceResult'
        '404':
          description: Source not found

  /api/places/{id}:
    get:
      summary: Get place detail (mentions + spots)
      operationId: getPlace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: centerLat
          in: query
          schema: { type: number, format: float }
        - name: centerLng
          in: query
          schema: { type: number, format: float }
      responses:
        '200':
          description: Place detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPlaceResult'
        '404':
          description: Place not found

  /api/sunreis/{id}:
    get:
      summary: Get a Sunrei (video preview / video detail)
      operationId: getSunrei
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: centerLat
          in: query
          schema: { type: number, format: float }
        - name: centerLng
          in: query
          schema: { type: number, format: float }
      responses:
        '200':
          description: Sunrei with spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSunreiResult'
        '404':
          description: Sunrei not found

  /api/tags:
    get:
      summary: List all bilingual tags
      operationId: listTags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagDTO'

  /api/search:
    get:
      summary: Unified search (places, sources, sunreis)
      description: >
        Database place hits, source hits, and published Sunrei hits. The client may merge Google
        Places autocomplete results into the places group. Google Places is handled client-side.
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: centerLat
          in: query
          schema: { type: number, format: float }
        - name: centerLng
          in: query
          schema: { type: number, format: float }
      responses:
        '200':
          description: Search result groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

components:
  schemas:
    # ===== Common =====
    ImageDTO:
      type: object
      required: [url]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }

    MultiSizeImageDTO:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageDTO'

    SourceType:
      type: string
      enum: [YOUTUBE, TV, ANIME, OTHER]

    TagDTO:
      type: object
      required: [id, labelEn, labelKo]
      properties:
        id: { type: string }
        labelEn: { type: string, maxLength: 64 }
        labelKo: { type: string, maxLength: 64 }
        description: { type: string, nullable: true }

    PlaceDTO:
      type: object
      required: [id, name, latitude, longitude, isClosed]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        latitude: { type: number, format: float }
        longitude: { type: number, format: float }
        googleMapsId: { type: string, nullable: true }
        isClosed: { type: boolean }
        closedReason: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        areaLabel:
          type: string
          nullable: true
          description: Optional display text (ward/city) derived from the address, for SpotRows.

    SourceDTO:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type:
          $ref: '#/components/schemas/SourceType'
        name: { type: string }
        nameEn: { type: string, nullable: true }
        nameKo: { type: string, nullable: true }
        synopsis: { type: string, nullable: true }
        externalUrl: { type: string, nullable: true }
        posterImage:
          allOf:
            - $ref: '#/components/schemas/MultiSizeImageDTO'
          nullable: true
        videoCount: { type: integer, nullable: true }
        spotCount: { type: integer, nullable: true }
        placeCount: { type: integer, nullable: true }
        nearestDistanceMeters: { type: number, format: double, nullable: true }

    SunreiSummaryDTO:
      type: object
      required: [id, sourceId, sourceName, sourceType, title, images, spotCount]
      properties:
        id: { type: string }
        sourceId: { type: string }
        sourceName: { type: string }
        sourceType:
          $ref: '#/components/schemas/SourceType'
        title: { type: string }
        summary: { type: string, nullable: true }
        link: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spotCount: { type: integer }
        placeCount: { type: integer, nullable: true }
        areaCount: { type: integer, nullable: true }
        nearestDistanceMeters: { type: number, format: double, nullable: true }

    SunreiSpotDTO:
      type: object
      required: [id, sunreiId, title, images, place, tags]
      properties:
        id: { type: string }
        sunreiId: { type: string }
        title: { type: string, maxLength: 128 }
        context:
          type: string
          nullable: true
          description: What this source says here ("7화에서 주인공이 울며 식사한 식당").
        youtubeLink: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        place:
          $ref: '#/components/schemas/PlaceDTO'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'
        distanceMeters: { type: number, format: double, nullable: true }

    SunreiDTO:
      type: object
      required: [id, sourceId, source, title, images, spots]
      properties:
        id: { type: string }
        sourceId: { type: string }
        source:
          $ref: '#/components/schemas/SourceDTO'
        title: { type: string }
        description: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        link: { type: string, nullable: true }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        spots:
          type: array
          items:
            $ref: '#/components/schemas/SunreiSpotDTO'

    # ===== PlaceCard / map =====
    PlaceMentionDTO:
      type: object
      description: One mention = one video row in the card. Multiple spots of the same video at the same place collapse into one mention.
      required: [source, sunreiId, sunreiTitle, spotId, images, tags]
      properties:
        source:
          $ref: '#/components/schemas/SourceDTO'
        sunreiId: { type: string }
        sunreiTitle: { type: string }
        spotId: { type: string, description: Representative spot (first with non-empty context). }
        context: { type: string, nullable: true }
        sunreiLink: { type: string, nullable: true, description: sunrei.link }
        youtubeLink: { type: string, nullable: true, description: sunrei_spot.youtube_link deep link }
        images:
          type: array
          items:
            $ref: '#/components/schemas/MultiSizeImageDTO'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'

    PlaceCardDTO:
      type: object
      description: One Place = one card = one marker. tags[] is the union of all published spots' tags at this place (powers client-side tag filter).
      required: [place, mentions, tags, sourceCount, sunreiCount, spotCount]
      properties:
        place:
          $ref: '#/components/schemas/PlaceDTO'
        distanceMeters: { type: number, format: double, nullable: true }
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/PlaceMentionDTO'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDTO'
        sourceCount: { type: integer }
        sunreiCount: { type: integer }
        spotCount: { type: integer }

    BoundsDTO:
      type: object
      required: [swLat, swLng, neLat, neLng]
      properties:
        swLat: { type: number, format: float }
        swLng: { type: number, format: float }
        neLat: { type: number, format: float }
        neLng: { type: number, format: float }

    # ===== Results =====
    ListPlacesResult:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items:
            $ref: '#/components/schemas/PlaceCardDTO'
        sources:
          type: array
          nullable: true
          description: Optional source rail data for the current map result.
          items:
            $ref: '#/components/schemas/SourceDTO'
        bounds:
          allOf:
            - $ref: '#/components/schemas/BoundsDTO'
          nullable: true

    GetPlaceResult:
      type: object
      required: [place, mentions, spots]
      properties:
        place:
          $ref: '#/components/schemas/PlaceDTO'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/PlaceMentionDTO'
        spots:
          type: array
          items:
            $ref: '#/components/schemas/SunreiSpotDTO'

    GetSourceResult:
      type: object
      required: [source, sunreis]
      properties:
        source:
          $ref: '#/components/schemas/SourceDTO'
        sunreis:
          type: array
          items:
            $ref: '#/components/schemas/SunreiSummaryDTO'
        places:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PlaceDTO'

    GetSunreiResult:
      type: object
      required: [sunrei]
      properties:
        sunrei:
          $ref: '#/components/schemas/SunreiDTO'

    ListSourcesResult:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceDTO'

    PlaceSearchHitDTO:
      type: object
      required: [place, mentionCount, sourceCount]
      properties:
        place:
          $ref: '#/components/schemas/PlaceDTO'
        mentionCount: { type: integer }
        sourceCount: { type: integer }
        distanceMeters: { type: number, format: double, nullable: true }

    SearchResult:
      type: object
      description: Three groups — Areas & places, Channels & programs, and Videos.
      required: [places, sources, sunreis]
      properties:
        places:
          type: array
          items:
            $ref: '#/components/schemas/PlaceSearchHitDTO'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceDTO'
        sunreis:
          type: array
          items:
            $ref: '#/components/schemas/SunreiSummaryDTO'
