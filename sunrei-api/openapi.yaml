openapi: 3.0.0
info:
  title: Sunrei API
  version: 1.0.0
  description: API documentation for Sunrei project
paths:
  /sunrei-spots:
    get:
      summary: List Sunrei Spots with filters
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: float
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: float
        - name: radius
          in: query
          required: true
          schema:
            type: number
            format: float
      responses:
        '200':
          description: Filtered list of Sunrei Spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSunreiSpotsResult'
  /sunreis:
    get:
      summary: List Sunrei with optional polygon filter
      parameters:
        - name: polygon
          in: query
          required: false
          description: JSON string of coordinate array forming a polygon to filter results (e.g., "[[35.6762,139.6503],[35.6795,139.7005],[35.6585,139.7454]]")
          schema:
            type: string
      responses:
        '200':
          description: List of Sunrei (all or filtered by polygon)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSunreiResult'
  /sunreis/{id}:
    get:
      summary: Get Sunrei by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID of the Sunrei to retrieve
      responses:
        '200':
          description: Details of the Sunrei
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSunreiResult'
components:
  schemas:
    Coordinate:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: float
          description: Latitude coordinate
        lng:
          type: number
          format: float
          description: Longitude coordinate
    ListSunreiParams:
      type: object
      required:
        - polygon
      properties:
        polygon:
          type: array
          minItems: 3
          items:
            $ref: '#/components/schemas/Coordinate'
          description: Array of coordinates forming a polygon (minimum 3 points)
    ListSunreiResult:
      type: object
      properties:
        sunreis:
          type: array
          items:
            $ref: '#/components/schemas/SunreiDTO'
          description: List of Sunrei within the polygon area
        totalCount:
          type: integer
          description: Total number of Sunrei found
    GetSunreiParams:
      type: object
      properties:
        id:
          type: integer
          description: ID of the Sunrei to retrieve
    GetSunreiResult:
      type: object
      properties:
        sunrei:
          $ref: '#/components/schemas/SunreiDTO'
    ListSunreiSpotsResult:
      type: array
      items:
        $ref: '#/components/schemas/SunreiSpotDTO'
    PlaceDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the place
        address:
          type: string
          description: Address of the place
        latitude:
          type: number
          format: float
          description: Latitude of the place
        longitude:
          type: number
          format: float
          description: Longitude of the place
    ImageDTO:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          description: URL of the image
        width:
          type: integer
          description: Width of the image in pixels
        height:
          type: integer
          description: Height of the image in pixels
        displayOrder:
          type: integer
          description: Display order for sorting images
    SunreiSpotDTO:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: Title of the Sunrei Spot
        description:
          type: string
          description: Detailed description of the Sunrei Spot
        youtubeLink:
          type: string
          description: YouTube video link for this spot
          nullable: true
        images:
          type: array
          description: Array of images for this spot
          items:
            $ref: '#/components/schemas/ImageDTO'
        places:
          type: array
          description: Foreign key to the associated Place
          items:
            $ref: '#/components/schemas/PlaceDTO'
    TagDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the tag
        description:
          type: string
          description: Description of the tag
          nullable: true
    SunreiDTO:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: Title of the Sunrei
        description:
          type: string
          description: Detailed description of the Sunrei
        link:
          type: string
          description: External link for this Sunrei (program URL or YouTube channel)
          nullable: true
        images:
          type: array
          description: Array of images for this Sunrei
          items:
            $ref: '#/components/schemas/ImageDTO'
        spots:
          type: array
          description: Array of Sunrei spots associated with this Sunrei
          items:
            $ref: '#/components/schemas/SunreiSpotDTO'
        tags:
          type: array
          description: Array of tags associated with this Sunrei
          items:
            $ref: '#/components/schemas/TagDTO'
