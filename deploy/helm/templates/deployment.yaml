{{- if .Values.admin.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sunrei.fullname" . }}-admin
  labels:
    {{- include "sunrei.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "admin") | nindent 4 }}
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      {{- include "sunrei.componentSelectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "admin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sunrei.componentSelectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "admin") | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
      - name: admin
        image: "{{ .Values.registry }}/{{ .Values.images.admin.repository }}:{{ .Values.images.admin.tag }}"
        imagePullPolicy: {{ .Values.images.admin.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.admin.service.port }}
          protocol: TCP
        env:
        {{- toYaml .Values.admin.env | nindent 8 }}
        resources:
          {{- toYaml .Values.resources.admin | nindent 10 }}
{{- end }}

