registry: ghcr.io/yongseongkim/sunrei

# 릴리스 workflow가 git 태그에서 v를 뗀 버전으로 tag를 갱신한다.
images:
  admin:
    repository: admin
    tag: 0.1.2
    pullPolicy: IfNotPresent
  app:
    repository: app
    tag: 0.1.2
    pullPolicy: IfNotPresent
  server:
    repository: server
    tag: 0.1.2
    pullPolicy: IfNotPresent

# GHCR 이미지가 public이라 비워 둔다.
imagePullSecrets: []

admin:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3102
  env:
    - name: NEXT_PUBLIC_API_URL
      value: "https://sunrei-api.yongseongkimm.com"
    - name: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-maps-api-key
    - name: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-maps-map-id
    - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-oauth-client-id

app:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3101
  env:
    - name: NEXT_PUBLIC_API_URL
      value: "https://sunrei-api.yongseongkimm.com"
    - name: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-maps-api-key
    - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-oauth-client-id

server:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3100
  env:
    - name: KTOR_ENV
      value: "prod"
    - name: DATABASE_HOST
      valueFrom:
        secretKeyRef:
          name: sunrei-infra-secrets
          key: database-host
    - name: DATABASE_PORT
      value: "5432"
    - name: DATABASE_NAME
      value: "sunrei"
    - name: DATABASE_USER
      value: "postgres"
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: sunrei-infra-secrets
          key: database-password
    - name: JWT_PAGE_TOKEN_SECRET
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: jwt-page-token-secret
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: aws-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: aws-secret-access-key
    - name: CORS_ALLOWED_HOSTS
      value: "sunrei.com,admin.sunrei.com,api.sunrei.com,yongseongkimm.com,sunrei.yongseongkimm.com,sunrei-admin.yongseongkimm.com"
    - name: GOOGLE_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-oauth-client-id
    - name: GOOGLE_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-oauth-client-secret
    - name: AUTH_JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: auth-jwt-secret

# 템플릿에서 읽지 않는 값이다.
# 공개 hostname과 Service 연결은 homelab-infra의 Cloudflare Tunnel 설정이 맡는다.
cloudflare:
  tunnel:
    enabled: true
    domains:
      app: sunrei.com
      admin: admin.sunrei.com
      server: api.sunrei.com

resources:
  admin:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  app:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  server:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
