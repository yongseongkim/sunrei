# Default values for sunrei
# This file will be automatically updated by release.sh script

# GitHub Container Registry (public images, no authentication required)
registry: ghcr.io/yongseongkim/sunrei

# Image tags (automatically updated by release.sh)
images:
  admin:
    repository: admin
    tag: v0.0.11
    pullPolicy: IfNotPresent
  app:
    repository: app
    tag: v0.0.11
    pullPolicy: IfNotPresent
  server:
    repository: server
    tag: v0.0.11
    pullPolicy: IfNotPresent

# Image pull secrets (not needed for public GHCR images)
imagePullSecrets: []

# Sunrei Admin (관리자 웹)
admin:
  enabled: true
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3102
  env:
    - name: NEXT_PUBLIC_API_URL
      value: "http://sunrei-server:3100"
    - name: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-maps-api-key
    - name: NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-maps-map-id
    - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-oauth-client-id

# Sunrei App (사용자 웹)
app:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3101
  env:
    - name: NEXT_PUBLIC_API_URL
      value: "http://sunrei-server:3100"
    - name: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-maps-api-key
    - name: NEXT_PUBLIC_GOOGLE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-oauth-client-id

# Sunrei Server (API 서버)
server:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3100
  env:
    - name: KTOR_ENV
      value: "prod"
    - name: DATABASE_HOST
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: database-host
    - name: DATABASE_PORT
      value: "5432"
    - name: DATABASE_NAME
      value: "sunrei"
    - name: DATABASE_USER
      value: "postgres"
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: database-password
    - name: JWT_PAGE_TOKEN_SECRET
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: jwt-page-token-secret
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: aws-access-key-id
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: aws-secret-access-key
    - name: CORS_ALLOWED_HOSTS
      value: "sunrei.com,admin.sunrei.com,api.sunrei.com,yongseongkimm.com,sunrei.yongseongkimm.com,sunrei-admin.yongseongkimm.com"
    - name: GOOGLE_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-oauth-client-id
    - name: GOOGLE_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: google-oauth-client-secret
    - name: AUTH_JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: sunrei-secrets
          key: auth-jwt-secret

# Cloudflare Tunnel Configuration
# Services are exposed via Cloudflare Tunnel (cloudflared)
# No Ingress needed - Tunnel connects directly to ClusterIP services
cloudflare:
  tunnel:
    enabled: true
    domains:
      app: sunrei.com
      admin: admin.sunrei.com
      server: api.sunrei.com

# Resource limits
resources:
  admin:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  app:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  server:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
