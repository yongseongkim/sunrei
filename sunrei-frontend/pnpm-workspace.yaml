packages:
  - 'packages/*'

# pnpm 11 removed onlyBuiltDependencies and defaults strictDepBuilds=true, so
# unapproved build scripts are a hard error. Build-script approvals now use the
# allowBuilds map (https://pnpm.io/settings#allowbuilds).
allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
